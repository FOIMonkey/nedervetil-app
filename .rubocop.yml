Layout/LineLength:
  Enabled: true
  Max: 80
  AllowCopDirectives: true
  AllowedPatterns:
    - "^\\s*it\\s+.*do$"
    - "^\\s*context\\s+.*do$"
    - "^\\s*describe\\s+.*do$"
    - "^RSpec\\.describe(\\s+|\\().*do$"
    - "^RSpec\\.shared_examples\\s.*do( \\|.*\\|)?$"
    - "^\\s*class\\s+[A-Z].*<.*"
    - "^\\s*def\\s"
    # Schema comments written by annotaterb, which rewrites them on migrate
    - "^#  \\w+\\s+:\\w+"
  Exclude:
    - bin/setup
    - config/environments/development.rb
    - config/environments/production.rb
    - config/environments/test.rb
    - config/initializers/backtrace_silencers.rb
    - config/initializers/content_security_policy.rb
    - config/initializers/new_framework_defaults*
    - db/migrate/*

