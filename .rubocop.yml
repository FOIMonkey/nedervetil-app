---
inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-capybara
  - rubocop-factory_bot
  - rubocop-performance
  - rubocop-rails

require:
  - "./lib/custom_cops/empty_lines_around_rescued_exceptions.rb"

#################### AllCops ####################

AllCops:
  TargetRubyVersion: 3.4
  RubyInterpreters:
    - ruby
    - rake
  Include:
    - "**/*.rb"
    - "**/*.gemfile"
    - "**/*.gemspec"
    - "**/*.rake"
    - "**/*.ru"
    - "**/*.spec"
    - "**/Gemfile"
    - "**/Rakefile"
    - "**/Vagrantfile"
  Exclude:
    - db/schema.rb
    - lib/themes/**/*
    - node_modules/**/*
    - vendor/**/*
    - ".git/**/*"
    - bin/rubocop
  DisplayCopNames: false
  StyleGuideCopsOnly: false
  DisabledByDefault: true

#################### Bundler ####################

Bundler/DuplicatedGem:
  Enabled: true

Bundler/DuplicatedGroup:
  Enabled: true

Bundler/GemFilename:
  Enabled: true

Bundler/InsecureProtocolSource:
  Enabled: true

