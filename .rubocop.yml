#################### Metrics ####################

Metrics/BlockNesting:
  Enabled: true

Metrics/ClassLength:
  Enabled: true
  Max: 250
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']

Metrics/CyclomaticComplexity:
  Enabled: true
  Max: 10
  # Without this, the Exclude below would replace the one in .rubocop_todo.yml.
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    # A list of independent permission rules, not one tangled method.
    - app/models/ability/document_rules.rb

Metrics/MethodLength:
  Enabled: true
  Max: 25
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  # Without this, the Exclude below would replace the one in .rubocop_todo.yml.
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    # A list of independent permission rules, not one tangled method.
    - app/models/ability/document_rules.rb
    # Historical schema definitions are naturally longer than 25 lines.
    - db/migrate/*

Metrics/ModuleLength:
  Enabled: true
  Max: 250
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']

Metrics/ParameterLists:
  Enabled: true
  Max: 5
  CountKeywordArgs: false

#################### Naming ####################

Naming/AccessorMethodName:
  Enabled: true

Naming/AsciiIdentifiers:
  Enabled: true

Naming/ClassAndModuleCamelCase:
  Enabled: true

Naming/ConstantName:
  Enabled: true

Naming/FileName:
  Enabled: true
  Exclude:
    # Themes override this file by its name.
    - 'config/custom-routes.rb'
    # Named after script/handle-mail-replies.rb, which the mail server runs.
    - 'spec/script/handle-mail-replies_spec.rb'

Naming/MethodName:
  Enabled: true

Naming/PredicateMethod:
  Enabled: true
  # A bang method may say whether it worked, as ActiveRecord's save! does.
  AllowBangMethods: true
  # call is RuboCop's default. save is for form objects that copy
  # ActiveRecord's save.
  AllowedMethods:
    - call
    - save

Naming/VariableName:
  Enabled: true

