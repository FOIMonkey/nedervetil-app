name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-trixie
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      PGHOST: 127.0.0.1
      PGUSER: postgres
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libpq-dev libmagic-dev libyaml-dev libffi-dev \
            poppler-utils qpdf ghostscript imagemagick \
            elinks tnef libemail-address-perl libemail-outlook-message-perl

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true

      - name: Configure test environment
        run: |
          cat > config/database.yml <<'YAML'
          test:
            adapter: postgresql
            encoding: unicode
            database: alaveteli_test
            host: 127.0.0.1
            username: postgres
            pool: 5
          YAML
          cp config/storage.yml-example config/storage.yml
          cp config/general.yml-example config/general.yml
          bundle exec rails db:create db:migrate

      - name: Zeitwerk autoload check
        run: bundle exec rails zeitwerk:check

      - name: Dead code check
        run: bundle exec rails dead_code

      - name: Brakeman security scan
        run: bundle exec brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Bundler audit
        run: bundle exec bundle-audit check --update

      - name: Build stylesheets
        run: bundle exec rails dartsass:build

      - name: Core smoke specs
        run: |
          bundle exec rspec \
            spec/integration/private_archive_spec.rb \
            spec/integration/sample_data_spec.rb \
            spec/integration/health_checks_spec.rb \
            spec/lib/configuration_spec.rb
